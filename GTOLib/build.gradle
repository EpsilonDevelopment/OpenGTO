plugins {
    id 'idea'
    id 'java-library'
    alias libs.plugins.modDevGradleLegacy
    alias libs.plugins.lombok
    alias libs.plugins.kotlin.jvm
    alias libs.plugins.kotlin.plugin
    alias libs.plugins.kotlin.lombok
}

version = mod_version

// GTCEu / datasynclib and the client both require JVM 21 bytecode.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Official GTOLib layout keeps Java and Kotlin sources together in src/main/java.
sourceSets {
    main {
        java.setSrcDirs(['src/main/java'])
        resources.setSrcDirs(['src/main/resources'])
    }
}

apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/dependencies.gradle"

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xmaxerrs' << '100000'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
}

// Java compilation resolves Kotlin declarations from the Kotlin output.
tasks.named('compileJava', JavaCompile) {
    options.incremental = false
    dependsOn tasks.named('compileKotlin')
    classpath += files(tasks.named('compileKotlin').map { it.destinationDirectory })
}

base {
    archivesName = mod_id
}

jar {
    manifest.attributes([
            'Specification-Title'   : project.name,
            'Specification-Version' : mod_version,
            'Implementation-Title'  : base.archivesName,
            'Implementation-Version': version,
            'MixinConfigs'          : 'gtolib.mixins.json',
    ])
    exclude "**/.cache"
}

java {
    withSourcesJar()
}

tasks.register('dumpCp') {
    doLast {
        file("$rootDir/cp.txt").text = configurations.compileClasspath.files.join("\n")
        println "classpath entries: " + configurations.compileClasspath.files.size()
    }
}
